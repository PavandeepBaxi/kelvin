name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # nightly rebuild so freshness labels stay accurate
  workflow_dispatch:       # the "Run workflow" button, for data updates

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: data
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.168.0
      SITE_URL: ${{ secrets.SITE_URL }}
      HUGO_PARAMS_PREVIEW: "true"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out site code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out private quiz data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PavandeepBaxi/kelvin-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: private-data
          persist-credentials: false

      - name: Use the real data
        run: |
          python3 -m json.tool private-data/quizzes.json > /dev/null
          cp private-data/quizzes.json data/quizzes.json
          rm -rf private-data

      - name: Install Hugo (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${file}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${file}" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build site
        run: hugo --minify --gc --baseURL "${SITE_URL}/"

      - name: Sanity checks
        run: |
          test -f public/_headers
          test -d public/glasgow

      - name: Package site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: public
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions: {}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Fetch built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy public --project-name=${{ secrets.PAGES_PROJECT }} --branch=main