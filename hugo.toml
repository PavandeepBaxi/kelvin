baseURL = "https://example.org/"
languageCode = "en-gb"
title = "Project Kelvin"
disableKinds = ["taxonomy", "term", "rss"]

[markup.goldmark.renderer]
  unsafe = false          # Markdown can never contain raw HTML

[security]
  enableInlineShortcodes = false
  [security.exec]
    allow = ['^$']        # Hugo may run no external programs
  [security.funcs]
    getenv = ['^HUGO_']   # templates can only read HUGO_* variables
  [security.http]
    urls = ['^$']         # templates can fetch nothing from the internet